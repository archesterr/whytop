version: 2
project_name: whytop

builds:
  - main: ./cmd/whytop
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - package_name: whytop
    maintainer: Armin Hossein Pour <you@example.com>
    homepage: https://github.com/archesterr/whytop
    description: Live terminal UI for troubleshooting Linux servers and desktops
    license: MIT
    formats: [deb, rpm]
    bindir: /usr/bin

# dockers_v2 builds and pushes both architectures and the manifest that
# points at them, so `docker pull ghcr.io/archesterr/whytop:1.2.3` resolves
# to the right one on amd64 and arm64 alike.
#
# One build context serves every platform, and the binaries land under
# linux/<arch>/ rather than at its root — Dockerfile.release copies through
# TARGETOS/TARGETARCH to match, and the ci workflow rebuilds the same layout
# so a release is never the first thing to find out they disagree.
dockers_v2:
  - images:
      - "ghcr.io/archesterr/whytop"
    tags:
      - "{{ .Version }}"
      - "latest"
    platforms: ["linux/amd64", "linux/arm64"]
    dockerfile: Dockerfile.release
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "Live terminal UI for troubleshooting Linux servers"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.licenses: "MIT"

checksum:
  name_template: checksums.txt

changelog:
  # "git" reads local commit history from the checkout (which actions/checkout
  # fetches in full via fetch-depth: 0). "github" instead asks the GitHub API
  # to compare the previous and current tags server-side — an extra moving
  # part that fails outright if a tag ever gets deleted (as happened here),
  # even though the release itself has everything it needs locally.
  use: git
  filters:
    exclude: ["^docs:", "^chore:", "^ci:", "^test:"]
