name: debian

# The packaging is built and checked on every pull request, not only when
# someone remembers. A debian/ directory that has drifted from the source it
# packages is worse than none: it fails in a sponsor's build, after they have
# already spent their time on it.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install the packaging toolchain
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential devscripts dh-golang golang-any lintian \
            ca-certificates git file binutils

      - uses: actions/checkout@v4

      - name: Which build dependencies does this suite actually have
        id: deps
        run: |
          set -eu
          # mk-build-deps fails with "Unable to install all build-dep
          # packages" and nothing else: not which package, not why. For a Go
          # program whose libraries are mostly newer than any Debian
          # release, that one line is the entire question — so it is asked
          # first, with the tool whose whole job is answering it.
          if dpkg-checkbuilddeps debian/control 2>/tmp/unmet; then
            echo "buildable=yes" >> "$GITHUB_OUTPUT"
            echo "Every Build-Depends exists in this suite."
            exit 0
          fi
          cat /tmp/unmet
          unmet=$(sed -e 's/.*Unmet build dependencies: //' /tmp/unmet)
          echo "buildable=no" >> "$GITHUB_OUTPUT"
          # Not a failure. Debian not having packaged a Go library yet is a
          # fact about the archive, not about this commit, and a check that
          # is red on every pull request for a reason nobody can act on in
          # that pull request is a check people stop reading. It is reported
          # where it will be seen and the packaging is left alone; anything
          # this repository can actually break still fails below.
          {
            echo "### whytop is not packageable on Debian trixie yet"
            echo
            echo "\`dpkg-checkbuilddeps\` could not satisfy:"
            echo
            # Version constraints and alternatives come through as their
            # own words — "golang-any (>= 2:1.26~)" would otherwise be
            # listed as three packages, two of them punctuation.
            printf '%s\n' "$unmet" | sed -e 's/([^)]*)//g' -e 's/|/ /g' \
              | tr -s ' ' '\n' | grep -v '^$' | sort -u | sed 's/^/- `/; s/$/`/' 
            echo
            echo "Each \`golang-*-dev\` above is a Go library that has to exist in"
            echo "Debian before whytop can be built there — that is the ITP's real"
            echo "blocker. See \`docs/PACKAGING.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Not packageable on Debian trixie yet — unmet: ${unmet}"

      - name: Build dependencies
        if: steps.deps.outputs.buildable == 'yes'
        run: |
          set -eux
          mk-build-deps -i -t "apt-get -y --no-install-recommends" debian/control

      - name: Build the package
        if: steps.deps.outputs.buildable == 'yes'
        run: |
          set -eux
          # No signing, and no network: an archive build has neither.
          dpkg-buildpackage -us -uc -b

      - name: Lintian
        if: steps.deps.outputs.buildable == 'yes'
        run: |
          set -eux
          lintian --info --display-info --pedantic --fail-on warning,error ../whytop_*.changes

      - name: The installed package behaves
        if: steps.deps.outputs.buildable == 'yes'
        run: |
          set -eux
          apt-get install -y ../whytop_*.deb
          whytop -version
          test -f /usr/share/man/man1/whytop.1.gz
          # The checks debian/tests/hardening runs under autopkgtest, run
          # here too so a pull request that loses PIE fails on the pull
          # request rather than in a sponsor's pipeline.
          readelf -h /usr/bin/whytop | grep -q 'Type:[[:space:]]*DYN'
          sh debian/tests/hardening
          sh debian/tests/no-self-update
          sh debian/tests/smoke
