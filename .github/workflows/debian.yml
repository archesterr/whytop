name: debian

# The packaging is built and checked on every pull request, not only when
# someone remembers. A debian/ directory that has drifted from the source it
# packages is worse than none: it fails in a sponsor's build, after they have
# already spent their time on it.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install the packaging toolchain
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential devscripts dh-golang golang-any lintian \
            ca-certificates git file binutils

      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          set -eux
          # mk-build-deps needs the Build-Depends to exist in the suite. When
          # one does not yet, this is where it says so — which is the answer
          # to "is whytop packageable today" in one line.
          apt-get install -y --no-install-recommends equivs
          mk-build-deps -i -t "apt-get -y --no-install-recommends" debian/control

      - name: Build the package
        run: |
          set -eux
          # No signing, and no network: an archive build has neither.
          dpkg-buildpackage -us -uc -b

      - name: Lintian
        run: |
          set -eux
          lintian --info --display-info --pedantic --fail-on warning,error ../whytop_*.changes

      - name: The installed package behaves
        run: |
          set -eux
          apt-get install -y ../whytop_*.deb
          whytop -version
          test -f /usr/share/man/man1/whytop.1.gz
          # The checks debian/tests/hardening runs under autopkgtest, run
          # here too so a pull request that loses PIE fails on the pull
          # request rather than in a sponsor's pipeline.
          readelf -h /usr/bin/whytop | grep -q 'Type:[[:space:]]*DYN'
          sh debian/tests/hardening
          sh debian/tests/no-self-update
          sh debian/tests/smoke
