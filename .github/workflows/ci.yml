name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod tidy && git diff --exit-code go.mod go.sum

      # `go get` silently raises go.mod's go directive to whatever the new
      # dependency needs, and the Dockerfile pins its own golang image. When
      # those drift apart nothing fails until the container build does,
      # three minutes in, with an error about a toolchain rather than about
      # the bump that caused it. This says so in seconds instead.
      - name: Dockerfile toolchain matches go.mod
        run: |
          set -eu
          need=$(awk '/^go /{print $2}' go.mod)
          have=$(awk -F'[:-]' '/^FROM golang:/{print $2}' Dockerfile)
          printf 'go.mod needs go %s; Dockerfile builds on golang:%s\n' "$need" "$have"
          # Compare major.minor only: the image tag is a series (1.24), the
          # directive is a point release (1.24.2), and any 1.24.x image
          # satisfies a 1.24.x directive.
          if [ "${need%.*}" != "$have" ]; then
            echo "::error::go.mod requires go ${need} but Dockerfile builds on golang:${have}." \
                 "Bump the FROM line, or pin the dependency that raised the go directive."
            exit 1
          fi
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build ./...
      - run: go test ./...

  # The release workflow only runs on a tag, so until now a broken container
  # build could only be discovered by a release failing — which is how the
  # v1.9.0 attempt found that Dockerfile.release was copying from the wrong
  # path. This builds both images on every pull request instead.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # The image humans build from source.
      - run: docker build -t whytop:ci --build-arg VERSION=ci .

      # The image goreleaser publishes. goreleaser builds it during its
      # *publish* phase, so `release --snapshot` skips it entirely and can't
      # stand in for this — the build context it hands the Dockerfile has to
      # be reproduced instead. Keep this layout in step with dockers_v2:
      # one context for every platform, binaries under linux/<arch>/.
      - name: Stage the release build context
        run: |
          set -eux
          for arch in amd64 arm64; do
            mkdir -p ctx/linux/"$arch"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -o ctx/linux/"$arch"/whytop ./cmd/whytop
          done
          cp Dockerfile.release ctx/Dockerfile
      - uses: docker/build-push-action@v6
        with:
          context: ctx
          platforms: linux/amd64,linux/arm64
          push: false
